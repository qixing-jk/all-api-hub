name: package-extension
description: Set up Node and pnpm, build the extension archives, and expose artifact metadata.

inputs:
  distribution-channel:
    description: Release artifact channel
    default: github-release
  build-stores:
    description: Produce separate archives for store submission
    default: "false"
  crx-signing-key:
    description: Base64-encoded PKCS#8 PEM key used to sign the self-update CRX; empty skips the CRX artifacts
    required: false
    default: ""
  require-crx-self-update:
    description: Fail the build instead of skipping when no CRX signing key is configured
    required: false
    default: "false"
  node-version-file:
    description: Path to the Node.js version file relative to the repository root
    required: false
    default: ".nvmrc"
  working-directory:
    description: Directory containing package.json and pnpm-lock.yaml
    required: false
    default: "."

outputs:
  artifact-files:
    description: Newline-delimited list of built archive file names
    value: ${{ steps.collect.outputs.artifact_files }}
  crx-files:
    description: Newline-delimited list of signed CRX and update-manifest file names
    value: ${{ steps.collect.outputs.crx_files }}
  chrome-zip:
    description: Path to the Chrome archive relative to the repository root
    value: ${{ steps.collect.outputs.chrome_zip }}
  firefox-zip:
    description: Path to the Firefox archive relative to the repository root
    value: ${{ steps.collect.outputs.firefox_zip }}
  sources-zip:
    description: Path to the sources archive relative to the repository root
    value: ${{ steps.collect.outputs.sources_zip }}
  package-version:
    description: Package version from package.json
    value: ${{ steps.collect.outputs.package_version }}

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v5
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: "pnpm"
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install

    - name: Package extension
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_OPTIONS: --max-old-space-size=6144
        AAH_DISTRIBUTION_CHANNEL: ${{ inputs.distribution-channel }}
        BUILD_STORES: ${{ inputs.build-stores }}
        AAH_CRX_PRIVATE_KEY_BASE64: ${{ inputs.crx-signing-key }}
        AAH_REQUIRE_CRX_SELF_UPDATE: ${{ inputs.require-crx-self-update }}
      run: |
        args=()
        if [ "$BUILD_STORES" = "true" ]; then args+=(--stores); fi
        node scripts/package-distribution.mjs "${args[@]}"

    - name: Collect artifact metadata
      id: collect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        shopt -s nullglob

        files=(.output/*.zip)
        chrome=(.output/*-chrome.zip)
        firefox=(.output/*-firefox.zip)
        sources=(.output/*-sources.zip)
        crx=(.output/*.crx)
        if [ -f .output/updates.xml ]; then crx+=(.output/updates.xml); fi

        if [ "${#files[@]}" -eq 0 ]; then
          echo "No zip artifacts found in .output."
          exit 1
        fi

        if [ "${#chrome[@]}" -ne 1 ] || [ "${#firefox[@]}" -ne 1 ] || [ "${#sources[@]}" -ne 1 ]; then
          echo "Expected exactly one chrome, firefox, and sources archive in .output."
          ls -la .output
          exit 1
        fi

        PREFIX=""
        if [ "${{ inputs.working-directory }}" != "." ]; then
          PREFIX="${{ inputs.working-directory }}/"
        fi

        PACKAGE_VERSION="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"

        {
          echo "artifact_files<<EOF"
          for file in "${files[@]}"; do
            basename "$file"
          done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        {
          echo "crx_files<<EOF"
          for file in "${crx[@]}"; do
            basename "$file"
          done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        echo "chrome_zip=${PREFIX}${chrome[0]}" >> "$GITHUB_OUTPUT"
        echo "firefox_zip=${PREFIX}${firefox[0]}" >> "$GITHUB_OUTPUT"
        echo "sources_zip=${PREFIX}${sources[0]}" >> "$GITHUB_OUTPUT"
        echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
