name: Set up the unit test browser
description: Restore Chromium and verify the host libraries used by browser-backed unit tests.

runs:
  using: composite
  steps:
    - name: Get Playwright version
      id: playwright_version
      shell: bash
      run: |
        node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); console.log('version=' + (pkg.devDependencies?.['@playwright/test'] ?? 'unknown'))" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      # Share the complete browser cache with the E2E workflows and all unit shards.
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright_version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Chromium for browser-backed unit tests
      # Keep headed Chromium for E2E consumers of the same cache. Install host
      # libraries only when a real headless launch reports missing dependencies.
      shell: bash
      run: |
        pnpm exec playwright install chromium
        probe_browser() {
          pnpm exec node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch({ headless: true, timeout: 15000 }); await browser.close();'
        }
        probe_log="${RUNNER_TEMP}/unit-chromium-probe.log"
        if probe_browser > "$probe_log" 2>&1; then
          echo "Chromium headless shell starts with existing host libraries."
          exit 0
        fi
        cat "$probe_log"
        if ! grep -Eq 'Host system is missing dependencies|error while loading shared libraries:' "$probe_log"; then
          exit 1
        fi
        pnpm exec playwright install-deps chromium
        probe_browser
