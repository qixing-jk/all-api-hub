name: Safari Smoke

on:
  workflow_dispatch:
  push:
    branches: [ci/safari-daily-smoke-trial]

permissions:
  contents: read

concurrency:
  group: safari-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      AAH_SAFARI_CI_SMOKE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check actual Safari automation access
        run: node e2e/safari/smoke.ts
      - name: Retain Safari evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: safari-smoke-${{ github.run_attempt }}
          path: |
            test-results/safari/*.json
            test-results/safari/*.txt
            test-results/safari/*.log
            test-results/safari/*.png
            .scratch/safari-native-cookie/runs/**/project/**/*.pbxproj
            .scratch/safari-native-cookie/runs/**/project/**/*.entitlements
          include-hidden-files: true
          retention-days: 7
