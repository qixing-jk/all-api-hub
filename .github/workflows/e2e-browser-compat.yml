name: E2E Browser Compatibility

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 18 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-build:
    uses: ./.github/workflows/e2e-build.yml

  chrome-compat:
    name: Chrome ${{ matrix.chrome_version }} compatibility (${{ matrix.shard }}/3)
    needs: e2e-build
    runs-on: ubuntu-latest
    # Covers the 35-minute test budget plus setup, the failure report, and
    # artifact upload, so a timeout never truncates the evidence.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # All Chrome versions and shards reuse the same extension build.
        shard: [1, 2, 3]
        chrome_version:
          # 114 is the current Chromium support floor for this build: the
          # manifest declares sidePanel, and chrome.sidePanel starts at 114.
          - "114"
          # 116 adds sidePanel.open and major MV3 service worker lifetime fixes.
          - "116"
          # 120 aligns chrome.alarms with the 30s MV3 service worker lifecycle.
          - "120"
          # 122 is a broad promise-support checkpoint for asynchronous extension APIs.
          - "122"
          # 144 has known community reports around extension messaging behavior.
          - "144"
          # 147 is the last pre-148 checkpoint before native browser namespace rollout.
          - "147"
          # 148 introduces native browser namespace and Promise-returning onMessage support.
          - "148"
          # stable catches the browser version users are most likely to auto-update to.
          - "stable"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download E2E extension
        uses: actions/download-artifact@v7
        with:
          name: e2e-extension-default
          path: .output/chrome-mv3-test

      - name: Setup Chrome ${{ matrix.chrome_version }}
        id: setup_chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ matrix.chrome_version }}
          install-dependencies: true

      - name: Run browser compatibility E2E
        timeout-minutes: 40
        env:
          AAH_E2E_CHROME_EXECUTABLE_PATH: ${{ steps.setup_chrome.outputs.chrome-path }}
          AAH_SKIP_E2E_BUILD: "1"
          AAH_E2E_SMOKE_ONLY: "1"
          # Retain each file's configured execution mode without fullyParallel.
          # Bound persistent extension contexts to avoid startup contention.
          AAH_E2E_WORKERS: "4"
        # Playwright finishes its report before the step or job is cancelled.
        # The list reporter preserves per-test progress even during a timeout.
        # Retain the budget for slow versions and retries until the new
        # concurrency has been measured across every version in CI.
        run: pnpm run e2e:default --shard=${{ matrix.shard }}/3 --global-timeout=2100000 --reporter=list,github,html

      - name: Upload Playwright artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-browser-compat-${{ matrix.chrome_version }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
