name: Translation Tooling Check

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "docs_assistant/**"
      - "tests/docs_assistant/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/translate-docs.yml"
      - ".github/workflows/translation-tooling-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translation-tooling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install "openai>=1.55.0" pyyaml

      - name: Test translation tooling
        run: python -m unittest discover -s tests/docs_assistant -p "test_*.py" -v

      - name: Check translation completeness
        run: python docs_assistant/find_missing.py --check
