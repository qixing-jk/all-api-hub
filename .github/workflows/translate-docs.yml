name: Auto Translate Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/docs/**/*.md"
      - "!docs/docs/en/**"
      - "!docs/docs/ja/**"
      - "docs_assistant/**"
      - "tests/docs_assistant/**"
      - ".github/workflows/translate-docs.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "翻译模式"
        required: true
        type: choice
        default: "changed"
        options:
          - changed
          - force_all
          - missing_only

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 获取完整历史以便比较变更

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "openai>=1.55.0" pyyaml

      - name: Test translation tooling
        run: python -m unittest discover -s tests/docs_assistant -p "test_*.py" -v

      - name: Get files to translate
        id: changed-files
        run: |
          set -o pipefail

          MODE="${{ github.event.inputs.mode }}"
          DOCS_ROOT='docs/docs'
          MISSING_FILES_OUTPUT="${RUNNER_TEMP}/missing_files.txt"
          DIFF_BASE="${{ github.event.before }}"
          DIFF_HEAD="${{ github.sha }}"

          # 如果是 push 触发，默认为 changed 模式
          if [ -z "$MODE" ]; then
            MODE="changed"
          fi

          if [ "$MODE" = "force_all" ] || [ "$MODE" = "missing_only" ]; then
            # 全量/补缺模式不应把上一提交中的译文误判为本次手动翻译。
            DIFF_BASE="$DIFF_HEAD"
          elif [ -z "$DIFF_BASE" ]; then
            DIFF_BASE='HEAD~1'
          fi

          echo "翻译模式: $MODE"

          # 检测手动翻译文件
          echo "🔍 检测手动翻译文件..."
          if [ "$MODE" = "force_all" ] || [ "$MODE" = "missing_only" ]; then
            MANUAL_TRANSLATIONS=""
          else
            MANUAL_TRANSLATIONS=$(
              git diff --name-only --diff-filter=AMR --find-renames "$DIFF_BASE" "$DIFF_HEAD" -- "$DOCS_ROOT/en" "$DOCS_ROOT/ja" \
                | tr '\n' ' '
            )
          fi
          if [ -n "$MANUAL_TRANSLATIONS" ]; then
            echo "📝 检测到手动翻译文件: $MANUAL_TRANSLATIONS"
          else
            echo "📝 未检测到手动翻译文件"
          fi

          if [ "$MODE" = "force_all" ]; then
            # 强制翻译所有文档
            echo "📚 获取所有文档文件..."
            CHANGED_FILES=$(
              find "$DOCS_ROOT" -name "*.md" -type f ! -path "$DOCS_ROOT/en/*" ! -path "$DOCS_ROOT/ja/*" | tr '\n' ' '
            )
            SOURCE_CHANGE_COUNT=$(find "$DOCS_ROOT" -name "*.md" -type f ! -path "$DOCS_ROOT/en/*" ! -path "$DOCS_ROOT/ja/*" | wc -l | tr -d ' ')

          elif [ "$MODE" = "missing_only" ]; then
            # 只翻译缺失的文档
            echo "🔍 检测缺失的翻译文件..."
            MISSING_FILES_OUTPUT="$MISSING_FILES_OUTPUT" python docs_assistant/find_missing.py
            if [ -f "$MISSING_FILES_OUTPUT" ]; then
              CHANGED_FILES=$(cat "$MISSING_FILES_OUTPUT" | tr '\n' ' ')
            else
              CHANGED_FILES=""
            fi
            SOURCE_CHANGE_COUNT=$(printf '%s' "$CHANGED_FILES" | wc -w | tr -d ' ')

          else
            # 正常模式：只翻译变更的文件
            echo "📝 获取变更的文件..."
            CHANGED_FILES=$(
              git diff --name-only --diff-filter=AMR --find-renames "$DIFF_BASE" "$DIFF_HEAD" -- "$DOCS_ROOT" \
                | awk '$0 ~ /^docs\/docs\/.*\.md$/ && $0 !~ /^docs\/docs\/(en|ja)\//' \
                | tr '\n' ' '
            )
            SOURCE_CHANGE_COUNT=$(
              git diff --name-only --diff-filter=AMRD --find-renames "$DIFF_BASE" "$DIFF_HEAD" -- "$DOCS_ROOT" \
                | awk '$0 ~ /^docs\/docs\/.*\.md$/ && $0 !~ /^docs\/docs\/(en|ja)\//' \
                | wc -l | tr -d ' '
            )
          fi

          echo "待翻译文件: $CHANGED_FILES"
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "manual_translations=$MANUAL_TRANSLATIONS" >> $GITHUB_OUTPUT
          echo "has_translate_files=$([ -n "$CHANGED_FILES" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "diff_base=$DIFF_BASE" >> $GITHUB_OUTPUT
          echo "diff_head=$DIFF_HEAD" >> $GITHUB_OUTPUT

          if [ "${SOURCE_CHANGE_COUNT:-0}" -eq 0 ]; then
            echo "✅ 没有需要处理的源文档变更"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            FILE_COUNT=$(printf '%s' "$CHANGED_FILES" | wc -w | tr -d ' ')
            echo "📊 共检测到 $SOURCE_CHANGE_COUNT 个源文档变更，其中 $FILE_COUNT 个需要翻译"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync translated docs for deletes and renames
        if: steps.changed-files.outputs.has_changes == 'true'
        env:
          TRANSLATE_DIFF_BASE: ${{ steps.changed-files.outputs.diff_base }}
          TRANSLATE_DIFF_HEAD: ${{ steps.changed-files.outputs.diff_head }}
        run: python docs_assistant/sync_translations.py

      - name: Translate documents
        if: steps.changed-files.outputs.has_translate_files == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          MAX_RETRIES: ${{ secrets.MAX_RETRIES || '3' }}
          RETRY_DELAY: ${{ secrets.RETRY_DELAY || '2' }}
          RETRY_BACKOFF: ${{ secrets.RETRY_BACKOFF || '2.0' }}
          MAX_WORKERS: ${{ secrets.MAX_WORKERS || '10' }}
          FORCE_TRANSLATE: ${{ (github.event_name == 'push' || github.event.inputs.mode == 'changed' || github.event.inputs.mode == 'force_all') && 'true' || 'false' }}
          TRANSLATE_SKIP_MANUAL: ${{ (github.event.inputs.mode == 'force_all' || github.event.inputs.mode == 'missing_only') && 'true' || 'false' }}
          TRANSLATE_DIFF_BASE: ${{ steps.changed-files.outputs.diff_base }}
          TRANSLATE_DIFF_HEAD: ${{ steps.changed-files.outputs.diff_head }}
        run: |
          echo "手动翻译文件: ${{ steps.changed-files.outputs.manual_translations }}"
          python docs_assistant/translate.py ${{ steps.changed-files.outputs.files }}

      - name: Check translation completeness
        run: python docs_assistant/find_missing.py --check

      - name: Setup pnpm for docs check
        if: steps.changed-files.outputs.has_changes == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js for docs check
        if: steps.changed-files.outputs.has_changes == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs dependencies
        if: steps.changed-files.outputs.has_changes == 'true'
        working-directory: docs
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check generated docs
        if: steps.changed-files.outputs.has_changes == 'true'
        working-directory: docs
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run docs:check

      - name: Create Pull Request
        if: steps.changed-files.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            🌐 Auto-translate documentation

            Files: ${{ steps.changed-files.outputs.files }}
          branch: auto-translate-${{ github.run_id }}
          delete-branch: true
          title: "🌐 Auto-translate documentation"
          body: |
            ## 📝 自动翻译

            此 PR 由 GitHub Actions 自动生成，包含文档的自动翻译。

            ### 📊 翻译信息
            - **触发方式**: ${{ github.event_name }}
            - **翻译模式**: ${{ github.event.inputs.mode || 'changed' }}
            - **工作流运行**: #${{ github.run_id }}

            ### 📁 翻译文件
            ```
            ${{ steps.changed-files.outputs.files }}
            ```

            ### ✅ 检查项
            - [ ] 翻译内容准确
            - [ ] 格式保持完整
            - [ ] 链接正常工作

            ---
            *Generated by [Auto Translate Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*
          labels: |
            documentation
            auto-translation
          assignees: ${{ github.actor }}
