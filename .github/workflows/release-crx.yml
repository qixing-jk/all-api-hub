name: release-crx-update

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Examples: v3.58.0 (tag), main, or a commit SHA. Leave empty to use the latest main commit."
        required: false
        default: ""
      upload_to_release:
        description: "Upload CRX/update manifest to the matching GitHub Release (requires the checkout ref to equal an existing release tag)."
        required: false
        type: boolean
        default: false

concurrency:
  group: release-crx-update
  cancel-in-progress: true

permissions:
  contents: write

env:
  CRX_ASSET_NAME: all-api-hub-chrome.crx
  UPDATE_XML_ASSET_NAME: update_manifest.xml

jobs:
  release-crx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.ref || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Build and package extension
        id: package
        uses: ./.github/actions/package-extension

      - name: Resolve release tag
        id: resolve_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_UPLOAD: ${{ github.event.inputs.upload_to_release }}
          CHECKOUT_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.ref || github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "upload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$DISPATCH_UPLOAD" != "true" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual uploads must point at the release that matches the built version.
          EXPECTED_TAG="v${{ steps.package.outputs.package-version }}"
          if [ "$CHECKOUT_REF" != "$EXPECTED_TAG" ]; then
            echo "::error::upload_to_release requires checking out the release tag ($EXPECTED_TAG) instead of '$CHECKOUT_REF'."
            exit 1
          fi
          echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Check CRX signing key availability
        id: keycheck
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret CRX_PRIVATE_KEY is not configured; skipping self-hosted CRX packaging. Generate one with 'ssh-keygen -t rsa -m PEM -f crx.pem' and store the PEM contents in the repository secret to enable this feature."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare self-hosted Chromium build with update_url
        if: steps.keycheck.outputs.has_key == 'true'
        id: prepare-selfhosted
        env:
          # Fixed "latest" URL: this workflow re-uploads update_manifest.xml
          # (--clobber) on every release, so the address never changes.
          UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/${{ env.UPDATE_XML_ASSET_NAME }}
        run: |
          CHROME_ZIP="${{ steps.package.outputs.chrome-zip }}"
          BUILD_DIR=".output/crx-build"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          unzip -q "$CHROME_ZIP" -d "$BUILD_DIR"

          MANIFEST="$(find "$BUILD_DIR" -maxdepth 2 -name manifest.json | head -n 1)"
          if [ -z "$MANIFEST" ]; then
            echo "::error::manifest.json not found inside $CHROME_ZIP."
            exit 1
          fi

          # Non-store installs poll this URL for updates; stores ignore the key,
          # but we keep the patch isolated to the self-hosted artifact anyway.
          node -e '
            const fs = require("node:fs");
            const path = process.argv[1];
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.update_url = process.env.UPDATE_URL;
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2));
          ' "$MANIFEST"

          ARCHIVE_ROOT="$(dirname "$MANIFEST")"
          SELFHOST_ZIP=".output/all-api-hub-${{ steps.package.outputs.package-version }}-chrome-selfhosted.zip"
          rm -f "$SELFHOST_ZIP"
          (cd "$ARCHIVE_ROOT" && zip -qr "$OLDPWD/$SELFHOST_ZIP" .)
          echo "selfhost_zip=$SELFHOST_ZIP" >> "$GITHUB_OUTPUT"

      - name: Pack signed CRX and update manifest
        if: steps.keycheck.outputs.has_key == 'true'
        id: crx
        uses: cardinalby/webext-buildtools-chrome-crx-action@2.0.3
        with:
          zipFilePath: ${{ steps.prepare-selfhosted.outputs.selfhost_zip || '' }}
          crxFilePath: .output/${{ env.CRX_ASSET_NAME }}
          privateKey: ${{ secrets.CRX_PRIVATE_KEY }}
          updateXmlPath: .output/${{ env.UPDATE_XML_ASSET_NAME }}
          updateXmlCodebaseUrl: https://github.com/${{ github.repository }}/releases/latest/download/${{ env.CRX_ASSET_NAME }}

      - name: Upload artifacts (no release upload)
        if: steps.keycheck.outputs.has_key == 'true' && steps.resolve_tag.outputs.upload != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: selfhosted-crx
          path: |
            .output/${{ env.CRX_ASSET_NAME }}
            .output/${{ env.UPDATE_XML_ASSET_NAME }}

      - name: Upload CRX and update manifest to release
        if: steps.keycheck.outputs.has_key == 'true' && steps.resolve_tag.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            ".output/$CRX_ASSET_NAME" \
            ".output/$UPDATE_XML_ASSET_NAME" \
            --clobber

      - name: Summarize
        if: steps.keycheck.outputs.has_key == 'true'
        run: |
          {
            echo "## Self-hosted CRX auto-update assets"
            echo ""
            echo "- \`${CRX_ASSET_NAME}\` — signed Chromium build with \`update_url\` baked in"
            echo "- \`${UPDATE_XML_ASSET_NAME}\` — served at the same fixed asset URL every release:"
            echo ""
            echo '```xml'
            cat ".output/$UPDATE_XML_ASSET_NAME"
            echo '```'
            echo ""
            echo "Users install the CRX once; Chrome polls \`update_url\` and applies newer releases silently."
          } >> "$GITHUB_STEP_SUMMARY"
