name: pr-build-preview

# On-demand only: previews are not rebuilt for every push. Ordinary PR checks already
# cover the build path, and merged code is packaged by the nightly release, so a
# per-push preview spent a runner slot that the queue needed for real checks.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build"
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Get PR details
        id: pr_details
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ inputs.pr_number }}
            });
            core.setOutput('ref', pr.head.ref);
            if (!pr.merge_commit_sha) throw new Error('PR has no merge commit to build');
            core.setOutput('sha', pr.merge_commit_sha);
            core.setOutput('number', pr.number);

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr_details.outputs.sha }}
          persist-credentials: false

      - name: Build extension bundles
        id: package
        uses: ./.github/actions/package-extension
        env:
          VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN || vars.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST || vars.VITE_PUBLIC_POSTHOG_HOST }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-build-${{ inputs.pr_number }}-${{ github.run_attempt }}
          path: .output/*.zip
          include-hidden-files: true

      - name: Comment build info on PR
        uses: actions/github-script@v9
        env:
          ARTIFACT_LIST: ${{ steps.package.outputs.artifact-files }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMIT_SHA: ${{ steps.pr_details.outputs.sha }}
        with:
          script: |
            const marker = "<!-- pr-build-artifact -->";
            const prNumber = parseInt(process.env.PR_NUMBER);
            const commitSha = process.env.COMMIT_SHA;
            // Link the short SHA to the GitHub commit page for quick navigation.
            const shortSha = commitSha ? commitSha.slice(0, 7) : "";
            const commitUrl = commitSha
              ? `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commitSha}`
              : "";
            const commitDisplay = commitSha
              ? "[`" + shortSha + "`](" + commitUrl + ")"
              : "`(unknown)`";

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactDownloadUrl = `${runUrl}#artifacts`;

            const artifactList = (process.env.ARTIFACT_LIST || "See workflow run for details.")
              .split("\n")
              .filter(Boolean)
              .map((name) => `- [${name}](${artifactDownloadUrl})`)
              .join("\n") || "- (none)";

            const body = [
              marker,
              `**Preview build ready** for commit ${commitDisplay}.`,
              "",
              "Artifacts:",
              artifactList,
              "",
              "_This build is for review only and is not released._",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
