name: Pull request title

# Title edits land in the same second as the push that triggered them, because
# release-please rewrites its pull request right after force-pushing the release
# branch. Keeping them in their own workflow keeps them out of the commit-range
# workflow's concurrency group, which would otherwise cancel one of the two runs.
on:
  pull_request:
    types: [edited]

permissions:
  contents: read

concurrency:
  # Own group, keyed by the workflow name, so it never competes with the
  # commit-range workflow. Queuing instead of cancelling: a cancelled run can
  # let the newest title through unchecked.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  title:
    name: Pull request title
    # Every edit to the release pull request body only rewrites the generated
    # release notes, and retyping them cannot change the title.
    if: github.event.changes.title != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # commitlint does not need the extension build performed by postinstall.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Lint pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
