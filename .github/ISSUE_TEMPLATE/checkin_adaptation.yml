name: Check-in feedback / 签到反馈
description: Report check-in problems, request site support, or share clues / 反馈签到问题、申请站点支持或补充线索
title: "[Check-in] "
labels: ["site-support", "check-in"]
body:
  - type: markdown
    attributes:
      value: |
        If you came from the extension, check that your report is filled in below. For a long report, paste the copied content into **Problem description or extension feedback** before submitting. Opening this page does not attach the report automatically.

        如果从扩展跳转到这里，请检查下方是否已有反馈。报告过长时，请将已复制的内容粘贴到「问题描述或扩展反馈」再提交。打开此页面不代表报告已自动附上。

        Remove anything you do not want to share publicly, including credentials. For an existing request, reply to that issue instead.
        请删除不想公开的信息及凭据；已有相关 issue 时请直接回复原帖。
  - type: input
    id: site-url
    attributes:
      label: Site / 站点
      description: Optional; only share an address you want to make public. / 选填，仅填写愿意公开的地址。
      placeholder: https://example.com
  - type: input
    id: extension-version
    attributes:
      label: Extension version / 扩展版本
  - type: textarea
    id: summary
    attributes:
      label: Brief summary / 简短摘要
      description: Optional. If the full report below already includes the description, you can leave this empty. / 选填；下方完整报告已有问题描述时，无需重复填写。
  - type: textarea
    id: feedback
    attributes:
      label: Problem description or extension feedback / 问题描述或扩展反馈
      description: Review any prefilled information, paste a copied report, or describe what happened. If convenient, add details below to help us investigate. No packet capture is required. / 请检查预填信息、粘贴复制的报告，或描述遇到的情况。如果方便，可在下方补充信息帮助排查，无需先抓包。
      placeholder: Paste the copied report here / 在此粘贴已复制的报告
    validations:
      required: true
  - type: input
    id: browser-info
    attributes:
      label: Browser and version (optional) / 浏览器及版本（选填）
      description: Helpful for browser-specific problems; omit it if the report already includes it. / 有助于排查特定浏览器的问题；报告已有此信息时无需重复填写。
      placeholder: e.g., Firefox 132, Chrome 130
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps and observed results (optional) / 操作步骤与实际结果（选填）
      description: If you remember, tell us where you started, what you clicked, and what happened on the website and in the extension. / 如果还记得，可说明从哪个入口进入、点击了什么，以及网页和扩展分别出现了什么结果。
